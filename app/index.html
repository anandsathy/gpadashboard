<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GPA Dashboard</title>
    <meta
      name="description"
      content="Track weighted and unweighted GPA across semesters, years, and cumulatively — grades 9 through 12."
    />
    <meta name="theme-color" content="#014421" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#04170E" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the theme before first paint so a dark-mode reload never flashes white.
      (function () {
        try {
          var stored = localStorage.getItem("gpa-dashboard:theme");
          var mode = stored === "light" || stored === "dark" ? stored : null;
          if (!mode) {
            mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      GPA Dashboard needs JavaScript enabled to calculate and display your grades.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
