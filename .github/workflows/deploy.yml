name: Deploy to GitHub Pages

# Optional, and MANUAL ON PURPOSE — see the trigger below.
#
# The site does not need this workflow. The build output is committed at the
# repository root, so Pages can serve the default branch directly, and Cloudflare
# Workers deploys from `dist/` via wrangler. This exists only for the case where
# you would rather Pages built from source itself.
#
# To turn it on:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   2. Run it from the Actions tab, or add a `push:` trigger back here.
#
# Step 1 is not optional. `actions/deploy-pages` fails with a 404 when the Pages
# source is anything else, so running this on every push to a repository that
# publishes some other way just paints main red for a deployment nobody asked
# for. That is exactly what happened, hence the manual trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push wait rather than cancel, so a
# half-finished deploy is not what lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # The build writes index.html + assets/ to the repository root, so that is
      # what gets uploaded — minus the source tree Pages has no use for.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp app/public/* _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
